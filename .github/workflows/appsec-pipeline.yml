###
name: AppSec Pipeline - OWASP Juice Shop

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  IMAGE_NAME: juice-shop

jobs:
  build:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Export immutable image reference
        id: publish
        env:
          DIGEST: ${{ steps.docker_build.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          IMAGE_REF="ghcr.io/${OWNER,,}/${IMAGE_NAME}@${DIGEST}"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

  sbom:
    name: SBOM - Syft (CycloneDX)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ needs.build.outputs.image_ref }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: SBOM summary
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          with open('sbom.cyclonedx.json', encoding='utf-8') as f:
              bom = json.load(f)
          components = bom.get('components', [])
          print(f'Total components: {len(components)}')
          for kind, count in Counter(c.get('type', '?') for c in components).most_common():
              print(f'  {kind}: {count}')
          PY

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90

  sca:
    name: SCA - Grype and Trivy
    runs-on: ubuntu-latest
    needs: sbom
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-cyclonedx-${{ github.sha }}

      - name: Scan SBOM with Grype
        uses: anchore/scan-action@v3
        with:
          sbom: sbom.cyclonedx.json
          severity-cutoff: high
          fail-build: false

      - name: Scan SBOM with Trivy
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            aquasec/trivy:latest sbom \
            --severity HIGH,CRITICAL \
            --format table \
            /work/sbom.cyclonedx.json

  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" -w /src \
            semgrep/semgrep:latest \
            semgrep scan --config p/owasp-top-ten --config p/nodejs --config p/secrets

  sonarqube:
    name: SAST - SonarCloud + Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # obligatoire — Sonar analyse tout l'historique git

      - name: Install dependencies and run tests (coverage)
        run: |
          npm ci
          npm test -- --coverage --coverageReporters=lcov --watchAll=false
        continue-on-error: true   # Juice Shop peut avoir des tests qui échouent

      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #  continue-on-error: true   # Juice Shop a des vulns intentionnelles — gate échouera

  secrets_scan:
    name: Secret scanning - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sign_and_attest:
    name: Sign image and attest SBOM - Cosign
    runs-on: ubuntu-latest
    needs: [build, sbom, sca, sast, sonarqube, secrets_scan]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-cyclonedx-${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image (keyless)
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
        run: cosign sign --yes "$IMAGE_REF"

      - name: Attest CycloneDX SBOM
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
        run: |
          cosign attest --yes \
            --predicate sbom.cyclonedx.json \
            --type cyclonedx \
            "$IMAGE_REF"

      - name: Verify attestation
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
        run: |
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/appsec-pipeline.yml@refs/heads/master$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_REF" > verified-attestation.json
          echo 'Attestation verified.'

  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: [build, sbom, sca, sast, sonarqube, secrets_scan]
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the exact built image
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
        run: |
          docker run -d --name juice-shop -p 3000:3000 "$IMAGE_REF"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              echo 'Juice Shop is ready.'
              exit 0
            fi
            sleep 3
          done
          docker logs juice-shop
          exit 1

      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: http://localhost:3000
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a'
          artifact_name: zap-report-${{ github.run_id }}
          allow_issue_writing: false
