# .github/workflows/appsec-pipeline.yml
name: AppSec Pipeline — OWASP Juice Shop

on:
  push:
    branches: [master]
  pull_request:

env:
  IMAGE: juice-shop
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        id: build
        run: |
          docker build -t $IMAGE:${{ github.sha }} .
          echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE:${{ github.sha }} 2>/dev/null || echo 'local')" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────
  sbom:
    name: SBOM Generation (Syft → CycloneDX)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build image (pour Syft)
        run: docker build -t $IMAGE:${{ github.sha }} .

      # Option A — anchore/sbom-action (recommandé, le plus simple)
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: cyclonedx-json            # ou spdx-json, syft-json
          output-file: sbom.cyclonedx.json
          artifact-name: sbom-cyclonedx     # stocké comme artifact GitHub Actions

      # Option B — Trivy native (si tu préfères un seul outil)
      # - name: Generate SBOM with Trivy
      #   run: |
      #     trivy image \
      #       --format cyclonedx \
      #       --output sbom.trivy.cyclonedx.json \
      #       $IMAGE:${{ github.sha }}

      # Afficher un résumé lisible du SBOM
      - name: SBOM summary
        run: |
          echo "=== SBOM components count ==="
          cat sbom.cyclonedx.json | python3 -c "
          import json, sys
          sbom = json.load(sys.stdin)
          components = sbom.get('components', [])
          print(f'Total components: {len(components)}')
          # Top 10 par type
          from collections import Counter
          types = Counter(c.get('type','?') for c in components)
          for t, count in types.most_common():
              print(f'  {t}: {count}')
          "

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90

  # ─────────────────────────────────────────────
  sca:
    name: SCA — Trivy + Grype (depuis SBOM)
    runs-on: ubuntu-latest
    needs: sbom
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-cyclonedx-${{ github.sha }}

      # Grype peut scanner directement un SBOM CycloneDX
      - name: Scan SBOM with Grype
        uses: anchore/scan-action@v3
        with:
          sbom: sbom.cyclonedx.json
          severity-cutoff: high
          fail-build: false               # adapter selon ta politique

      # Trivy sur le SBOM (double check)
      - name: Trivy vuln scan from SBOM
        run: |
          docker run --rm \
            -v $PWD:/work \
            aquasec/trivy:latest sbom \
            --severity HIGH,CRITICAL \
            --format table \
            /work/sbom.cyclonedx.json

  # ─────────────────────────────────────────────
  sast:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/nodejs
            p/secrets

  # ─────────────────────────────────────────────
  secrets:
    name: Secret scanning — Gitleaks
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  sign-and-attest:
    name: Sign image + Attest SBOM (Cosign)
    runs-on: ubuntu-latest
    needs: [sbom, sca, sast, secrets]
    permissions:
      contents: read
      packages: write
      id-token: write                     # nécessaire pour Cosign keyless
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-cyclonedx-${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Push image to registry
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }} .
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}

      # Signe l'image
      - name: Sign image with Cosign (keyless)
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}

      # Atteste le SBOM → lie le SBOM à l'image de façon vérifiable
      - name: Attest SBOM with Cosign
        run: |
          cosign attest --yes \
            --predicate sbom.cyclonedx.json \
            --type cyclonedx \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}

      # Vérification (preuve que ça marche)
      - name: Verify attestation
        run: |
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }} \
            | jq '.payload | @base64d | fromjson | .predicate.metadata'

  # ─────────────────────────────────────────────
  dast:
    name: DAST — OWASP ZAP
    runs-on: ubuntu-latest
    needs: sign-and-attest
    steps:
      - uses: actions/checkout@v4

      - name: Start Juice Shop
        run: |
          docker run -d --name juice-shop -p 3000:3000 \
            bkimminich/juice-shop
          sleep 10

      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: http://localhost:3000
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a'
